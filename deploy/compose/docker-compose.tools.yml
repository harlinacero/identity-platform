# Development toolchains, so that no SDK or CLI is installed on the host (ADR-0005).
# They only start on demand: `./dev.ps1 run <tool> <dir> <command...>`.
# Caches live in named volumes because bind mounts are slow on Windows.
name: identity-platform

x-tool: &tool
  profiles: ["tools"]
  working_dir: /workspace
  stdin_open: true
  tty: true

# Testcontainers starts sibling containers through the host's Docker engine.
x-testcontainers: &testcontainers
  TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

services:
  dotnet:
    <<: *tool
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      <<: *testcontainers
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      NUGET_PACKAGES: /caches/nuget
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - .:/workspace
      - nuget_cache:/caches/nuget
      - /var/run/docker.sock:/var/run/docker.sock

  java:
    <<: *tool
    image: eclipse-temurin:21-jdk
    environment:
      <<: *testcontainers
      GRADLE_USER_HOME: /caches/gradle
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - .:/workspace
      - gradle_cache:/caches/gradle
      - /var/run/docker.sock:/var/run/docker.sock

  go:
    <<: *tool
    image: golang:1.25
    environment:
      GOMODCACHE: /caches/go/mod
      GOCACHE: /caches/go/build
    volumes:
      - .:/workspace
      - go_cache:/caches/go

  python:
    <<: *tool
    image: python:3.12-slim
    environment:
      # Installed packages persist in a volume, outside the Windows bind mount.
      PIP_USER: "1"
      PIP_ROOT_USER_ACTION: ignore
      PYTHONUSERBASE: /caches/python
      PIP_CACHE_DIR: /caches/python/pip-cache
      PATH: /caches/python/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - .:/workspace
      - python_cache:/caches/python

  node:
    <<: *tool
    image: node:22-slim
    environment:
      npm_config_cache: /caches/npm
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace
      - npm_cache:/caches/npm
      # node_modules stays in Linux volumes: faster than a bind mount, no symlink issues on Windows.
      - notifications_node_modules:/workspace/services/notifications/node_modules
      - account_web_node_modules:/workspace/frontends/account-web/node_modules
      - admin_console_node_modules:/workspace/frontends/admin-console/node_modules

  k6:
    <<: *tool
    image: grafana/k6:1.3.0
    entrypoint: []
    volumes:
      - .:/workspace

  terraform:
    <<: *tool
    image: hashicorp/terraform:1.13
    entrypoint: []
    environment:
      TF_PLUGIN_CACHE_DIR: /caches/terraform
    volumes:
      - .:/workspace
      - terraform_cache:/caches/terraform

  # kind, kubectl and helm. kind creates its nodes through the host's Docker engine.
  k8s:
    <<: *tool
    build: ./deploy/tools/k8s
    image: identity-platform/k8s-tools:local
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  nuget_cache:
  gradle_cache:
  go_cache:
  python_cache:
  npm_cache:
  terraform_cache:
  notifications_node_modules:
  account_web_node_modules:
  admin_console_node_modules:
